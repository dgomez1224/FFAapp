# When we push to main, trigger Zorya to sync /sports from this repo.
# In FFAapp repo Settings → Secrets and variables → Actions: add ZORYA_SYNC_PAT
# (a GitHub PAT with repo scope, so this workflow can trigger maximizo/Zorya-Website).
name: Trigger Zorya sports sync

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Zorya sync workflow
        env:
          ZORYA_SYNC_PAT: ${{ secrets.ZORYA_SYNC_PAT }}
        run: |
          if [ -z "$ZORYA_SYNC_PAT" ]; then
            echo "ZORYA_SYNC_PAT secret is missing or empty."
            exit 1
          fi
          code=$(curl -sS -o /tmp/zorya-dispatch.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${ZORYA_SYNC_PAT}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/maximizo/Zorya-Website/dispatches \
            -d '{"event_type":"sync-sports"}')
          echo "Dispatch HTTP status: ${code}"
          if [ -s /tmp/zorya-dispatch.json ]; then
            cat /tmp/zorya-dispatch.json
            echo
          fi
          if [ "${code}" != "204" ]; then
            echo "Zorya repository_dispatch failed. Update ZORYA_SYNC_PAT with a valid PAT that has repo access to maximizo/Zorya-Website."
            exit 1
          fi
